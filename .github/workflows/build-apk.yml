name: Build Eling APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Pengingatku-source-final.zip'
      - 'assets/eling_launcher.webp'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract uploaded project archive when present
        run: |
          if [ -f Pengingatku-source-final.zip ]; then
            unzip -oq Pengingatku-source-final.zip -d .
          fi
          test -f app/build.gradle
          test -f settings.gradle

      - name: Apply Eling branding and launcher icon
        run: |
          set -euo pipefail
          test -s assets/eling_launcher.webp
          RES="app/src/main/res"
          mkdir -p "$RES/mipmap-nodpi"
          find "$RES" -maxdepth 2 -type f \\( -path "$RES/mipmap*" \\) \\( -name 'ic_launcher*' -o -name 'ic_app_icon*' \\) -delete
          cp assets/eling_launcher.webp "$RES/mipmap-nodpi/ic_launcher.webp"
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("app/src/main/AndroidManifest.xml")
          s = manifest.read_text()
          s, n = re.subn(r'android:(?:roundIcon|icon)="[^"]+"', lambda m: m.group(0).split("=")[0] + '="@mipmap/ic_launcher"', s)
          if not re.search(r'android:icon=', s):
              s = re.sub(r'<application\\b', '<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"', s, count=1)
          elif not re.search(r'android:roundIcon=', s):
              s = re.sub(r'(android:icon="@mipmap/ic_launcher")', r'\\1 android:roundIcon="@mipmap/ic_launcher"', s, count=1)
          manifest.write_text(s)
          strings = Path("app/src/main/res/values/strings.xml")
          s = strings.read_text()
          if re.search(r'<string name="app_name">.*?</string>', s, re.S):
              s = re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">Eling</string>', s, count=1, flags=re.S)
          else:
              s = s.replace('</resources>', '    <string name="app_name">Eling</string>\\n</resources>')
          s = re.sub(r'<string name="widget_description">.*?</string>', '<string name="widget_description">Widget alarm dan catatan Eling</string>', s, count=1, flags=re.S)
          strings.write_text(s)
          PY
          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          test -s "$RES/mipmap-nodpi/ic_launcher.webp"

      - name: Make widget layout compatible with RemoteViews
        run: |
          sed -i 's/<View$/<TextView/' app/src/main/res/layout/widget_taskbell.xml
          if grep -Eq '<View([[:space:]>])' app/src/main/res/layout/widget_taskbell.xml; then
            echo "Unsupported View element remains in widget layout"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Eling-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
