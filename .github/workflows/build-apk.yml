name: Build Eling APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Pengingatku-source-final.zip'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract uploaded project archive when present
        run: |
          if [ -f Pengingatku-source-final.zip ]; then
            unzip -oq Pengingatku-source-final.zip -d .
          fi
          test -f app/build.gradle
          test -f settings.gradle

      - name: Make widget layout compatible with RemoteViews
        run: |
          sed -i 's/<View$/<TextView/' app/src/main/res/layout/widget_taskbell.xml
          if grep -Eq '<View([[:space:]>])' app/src/main/res/layout/widget_taskbell.xml; then
            echo "Unsupported View element remains in widget layout"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Eling-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
