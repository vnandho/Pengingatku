name: Build Eling APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Pengingatku-source-final.zip'
      - 'Eling-icon.webp.b64'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract uploaded project archive when present
        run: |
          if [ -f Pengingatku-source-final.zip ]; then
            unzip -oq Pengingatku-source-final.zip -d .
          fi
          test -f app/build.gradle
          test -f settings.gradle

      - name: Apply Eling branding and HD launcher icon
        run: |
          mkdir -p app/src/main/res/mipmap-nodpi
          base64 --decode Eling-icon.webp.b64 > app/src/main/res/mipmap-nodpi/ic_launcher.webp
          sed -i 's#android:icon="@drawable/ic_app_icon"#android:icon="@mipmap/ic_launcher"#' app/src/main/AndroidManifest.xml
          sed -i 's#android:label="@string/app_name"#android:label="@string/app_name"#' app/src/main/AndroidManifest.xml
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">Eling</string>#; s#<string name="widget_description">[^<]*</string>#<string name="widget_description">Widget alarm dan catatan Eling</string>#' app/src/main/res/values/strings.xml
          sed -i 's#android:description="@string/widget_description"#android:description="@string/widget_description" android:label="@string/app_name"#' app/src/main/res/xml/taskbell_widget_info.xml
          sed -i 's/text = "Pengingatku"/text = "Eling"/; s/Widget → Pengingatku/Widget → Eling/' app/src/main/java/com/pengingatku/widget/MainActivity.kt
          sed -i 's/Pengingatku · Alarm berbunyi/Eling · Alarm berbunyi/g; s/"Pengingatku"/"Eling"/g; s/Pengingatku:AlarmRing/Eling:AlarmRing/g' app/src/main/java/com/pengingatku/widget/AlarmRingService.kt

      - name: Make widget layout compatible with RemoteViews
        run: |
          sed -i 's/<View$/<TextView/' app/src/main/res/layout/widget_taskbell.xml
          if grep -Eq '<View([[:space:]>])' app/src/main/res/layout/widget_taskbell.xml; then
            echo "Unsupported View element remains in widget layout"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Eling-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
